<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Me</title>
  <link rel="stylesheet" href="bugs.css">
</head>
<body>
  <div class="menu">
    <a href="../index.html">Home</a>
    <a href="../menu.html">Menu</a>
  </div>
 
  <main>
    <h1>Debug Me</h1>
    <h2>Today's special</h2>
    <img src="../images/logo.svg" alt="Campus Café coffee cup logo" width="80" height="80">
 
    <form id="subscribe-form">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <button class="btn" type="submit">Subscribe</button>
    </form>
    <p id="subscribe-status" role="status" aria-live="polite"></p>
 
    <p class="note">We never share your email address.</p>
  </main>
  <script>
    document.querySelector("#subscribe-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.querySelector("#subscribe-status").textContent =
        "Subscription is not available on this demo page.";
    });
  </script>
</body>
</html>
